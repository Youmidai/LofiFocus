# Reverse proxy для LofiFocus.
#   /static/*  — Nginx отдаёт файлы сам, без обращения к бэкенду
#   всё прочее — перенаправляется на Gunicorn/Uvicorn (127.0.0.1:8000)
#
# Windows: положите файл в папку nginx\conf (рядом с mime.types) и укажите
# в `alias` путь к папке static проекта с прямыми слэшами, например
#   alias C:/Users/yawki/Desktop/техсп/LofiFocus/static/;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    gzip        on;
    gzip_types  application/json text/css application/javascript text/plain;

    upstream lofifocus_backend {
        server 127.0.0.1:8000;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 1m;

        # Статические данные
        location /static/ {
            alias /var/www/lofifocus/static/;
            expires 1h;
            add_header Cache-Control "public";
        }

        # Всё остальное — на бэкенд (REST API, Swagger UI на /docs)
        location / {
            proxy_pass http://lofifocus_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }
}
