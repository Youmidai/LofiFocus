syntax = "proto3";

package recommendations;

// Простые рекомендации без ML на основе статистики.

service RecommendationService {
  // Рекомендация плейлистов для слушателя и/или настроения.
  rpc RecommendPlaylists(PlaylistRecommendationRequest) returns (PlaylistRecommendationResponse);

  // Рекомендация треков для слушателя и/или настроения.
  rpc RecommendTracks(TrackRecommendationRequest) returns (TrackRecommendationResponse);
}

message PlaylistRecommendationRequest {
  int32 listener_id = 1;  // ID Listener, 0 если не указан
  int32 mood_id = 2;      // ID Mood, 0 если не указан
  int32 limit = 3;        // макс. кол-во результатов, по умолчанию 10
}

message RecommendedPlaylist {
  int32 playlist_id = 1;
  int32 mood_id = 2;
  int32 score = 3;        // простой счёт (частота использования и т.п.)
}

message PlaylistRecommendationResponse {
  repeated RecommendedPlaylist playlists = 1;
}

message TrackRecommendationRequest {
  int32 listener_id = 1;
  int32 mood_id = 2;
  int32 limit = 3;
}

message RecommendedTrack {
  int32 track_id = 1;
  int32 mood_id = 2;
  int32 score = 3;
}

message TrackRecommendationResponse {
  repeated RecommendedTrack tracks = 1;
}
